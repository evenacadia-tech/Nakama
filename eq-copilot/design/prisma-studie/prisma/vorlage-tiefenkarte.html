<html lang="de">
<head>
<meta charset="utf-8">
<title>NAKAMA · Tiefenkarte Lichtwelt</title>
<!--
  TIEFENKARTE fuer den Unicorn-Parallax-Effekt der Lichtwelt (Boden-
  Ebene mit Horizont). Konvention: WEISS = nah (bewegt sich stark),
  SCHWARZ = fern (steht) — wirkt die Bewegung verkehrt, in Unicorn
  invertieren.

  Physik: fuer einen FLACHEN Boden ist die Parallaxe (Disparitaet)
  LINEAR in der Bildhoehe — 0 am Horizont, maximal an der Unterkante
  (inverse Tiefe eines Bodens ist linear in Screen-y). Der Himmel/Raum
  ueber dem Horizont ist unendlich fern = schwarz. Leichter Dither
  verhindert 8-bit-Banding (sichtbare Parallax-Stufen).

  ?horizont=718   Horizont-Zeile in px (Vorgabe passt zur Gitter-
                  Komposition vom 19.08., Artboard 1920x1280)
  ?rand=24        weicher Uebergang am Horizont in px
-->
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="karte" width="1920" height="1280"></canvas>
<script>
"use strict";
const PARAMS = new URLSearchParams(location.search);
const hRoh = parseFloat(PARAMS.get("horizont") ?? "718");
const HORIZONT = Number.isFinite(hRoh) ? Math.min(1240, Math.max(40, hRoh)) : 718;
const rRoh = parseFloat(PARAMS.get("rand") ?? "24");
const RAND = Number.isFinite(rRoh) ? Math.max(0, rRoh) : 24;

const BW = 1920, BH = 1280;
const c = document.getElementById("karte").getContext("2d");
const bild = c.createImageData(BW, BH);
const d = bild.data;

// Deterministischer Dither (kein Math.random: Karte bleibt reproduzierbar)
const rausch = k => { const s = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

for (let y = 0; y < BH; y++) {
  // Boden: lineare Disparitaet 0 (Horizont) -> 1 (Unterkante);
  // weicher Einsatz ueber RAND px, Himmel darueber = 0.
  let wert = 0;
  if (y > HORIZONT - RAND) {
    const t = Math.min(1, Math.max(0, (y - HORIZONT) / (BH - 1 - HORIZONT)));
    const einsatz = Math.min(1, Math.max(0, (y - (HORIZONT - RAND)) / Math.max(1, RAND)));
    wert = t * einsatz;
  }
  for (let x = 0; x < BW; x++) {
    const dither = (rausch(x * 7 + y * 3271) - 0.5) * (1.6 / 255);
    const g = Math.round(Math.min(1, Math.max(0, wert + dither)) * 255);
    const i = (y * BW + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = g;
    d[i + 3] = 255;
  }
}
c.putImageData(bild, 0, 0);
</script>
</body>
</html>

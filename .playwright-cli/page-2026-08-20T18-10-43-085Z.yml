    - generic [ref=e8]: "Zwei Dinge sind entschieden. Overview + Detail ist abgenommen, und die Aufteilung steht seit deiner gelben Linie: Karte und Arbeitsfläche bekommen erst ihre natürliche Höhe, der Überschuss wird geteilt — nicht einer Seite ganz zugeschlagen. Gemessen liegt die Grenze damit bei 245 px; deine Linie lag bei rund 250. Die Karte darf dabei wachsen, aber nicht schrumpfen: sie ist das dauerhafte Ding. Offen ist nur noch, was die Karte zeigt. Drei Antworten nebeneinander, gleicher Streifen, gleiche Arbeitsfläche. Die Klemme bleibt echt: bei 16 Quellen braucht eine Karte mit je einer Zeile 212 der 370 px, der Assistent braucht in seiner von der Spezifikation vorgeschriebenen Fünf-Teile-Form 172. Beides zugleich geht nicht. Graustufen, keine Optik. Unten den Arbeitsschritt wechseln und „Was bleibt dauerhaft stehen?\" einschalten."

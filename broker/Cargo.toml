[package]
name = "eqcop-broker"
version = "0.1.0"
edition = "2021"
# G2-MSRV-001: der tatsaechlich noetige Compilerboden, nicht eine runde Zahl.
# Er ist das MAXIMUM aus zwei Quellen, nicht nur aus dem eigenen Code:
#
# (a) Eigener Code: die juengste benutzte Standardmethode ist
#     `Option::is_none_or`, stabil seit 1.82.0 (aggregat.rs,
#     coordinator/liveness.rs, protokoll.rs). Darunter liegen
#     `usize::div_ceil` (1.73, transport/pipetoken.rs) und `OnceLock` (1.70).
# (b) Die im eingecheckten Cargo.lock GESPERRTEN Abhaengigkeiten. Ihr hoechster
#     Boden liegt bei 1.85.0 (`uuid 1.24.1` und `getrandom 0.4.3`); mit 1.82
#     brach `cargo +1.82 check --locked` vor dem Kompilieren ab, die Zusage war
#     also falsch (Abschlusspruefung 1, Befund G2-MSRV-001, 03.09.2026).
#
# Der Boden ist damit 1.85. Der Inlinetest `rust_version_boden_ist_exakt_gepinnt`
# in store/mod.rs haelt (a) an dieser Begruendung fest; sein Zwilling
# `rust_version_deckt_alle_gesperrten_abhaengigkeiten` misst (b) ueber
# `cargo metadata --locked` und faellt, sobald eine gesperrte Kiste mehr
# verlangt als hier deklariert ist.
rust-version = "1.85"
description = "EQ-Copilot-Broker (Nakama) — eigenständiger Named-Pipe-Server, aus der Plugin-Hub-App herausgelöst (18.08.2026)"

# G2-CARGOLINT-001 / H-22, drei Teile mit unterschiedlicher Beweiskraft:
#
# (a) `unsafe_op_in_unsafe_fn` ist ein RUSTC-Lint und wirkt im Bau - damit im
#     bestehenden Kanon-Bein A4, ohne ein neues. Er greift auf die einzige
#     `unsafe fn` des Crates.
# (b) Die eigentliche Zusage - jede unsafe-Stelle traegt ihren
#     Sicherheitskommentar - misst der Test `jeder_unsafe_block_traegt_einen_safety_kommentar`
#     in broker/tests/security_vectors.rs. Er ist der dauerhafte Nachweis.
# (c) `undocumented_unsafe_blocks` ist ein reiner CLIPPY-Lint. Er steht hier,
#     BEWEIST im Kanon aber nichts: tools/beweise.ps1 faehrt in keinem Bein
#     Clippy. Die Clippy-Verdrahtung ist benannte Haertung ausserhalb dieses
#     Tickets; `tools/` bleibt unangetastet und die Beinzahl bleibt 40.
#
# Die [lints]-Tabelle gilt ab Cargo 1.74; gemessen laeuft hier cargo 1.93.1,
# und rust-version steht auf 1.82.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "eqcop_broker"
path = "src/lib.rs"

[dependencies]
# SONDE-005b: MUSS die Version aus eq-copilot/schemas/v3/flatbuffers/WERKZEUG.json
# tragen. Der von flatc erzeugte Rust-Code ruft in diese Laufzeit; eine andere
# Version ist entweder ein Uebersetzungsfehler oder - schlimmer - eine stille
# Inkompatibilitaet. pruefe_flatc_drift.py haelt beide gegeneinander.
flatbuffers = "25.12.19"
serde = { version = "1", features = ["derive"] }
# SONDE-010: SHA-256 fuer den v3-Pipetoken (Entwurf §48.3). Er ist ab hier
# PRODUKTIONSCODE (transport::pipetoken) und keine Testbeigabe mehr - deshalb
# wandert die Crate aus [dev-dependencies] hierher. Der RFC-8785-state_hash
# nutzt dieselbe Crate weiter, jetzt ohne zweiten Eintrag.
sha2 = "0.10"
serde_json = "1"
# SONDE-011 Phase B: produktive persistente P0-Events speichern ihre interne
# Befehlswirkung als RFC-8785-kanonische Bytes fuer exakte Retry-Gleichheit.
serde_json_canonicalizer = "0.3"
uuid = { version = "1", features = ["v4"] }
# SONDE-011 Phase B / V-01: SQLite ist Teil des Broker-Binaries. Die exakte
# Version und `bundled` sind eine geprüfte Reproduzierbarkeitsgrenze der Matrix.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

<html lang="de">
<head>

<title>Nakama / Problemreaktionen</title>
<style>
@font-face {
  font-family: "Manrope Variable";
  src: url("./fonts/Manrope-Variable.ttf") format("truetype");
  font-weight: 200 800;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: dark;
  --sumi: #0b0d0d;
  --field: #101615;
  --field-raised: #18201e;
  --surface: #202724;
  --edge: #3a433e;
  --grid: #2a332f;
  --grid-soft: #1a211f;
  --washi: #eee9dc;
  --washi-soft: #b8b5aa;
  --stone: #858b85;
  --indigo: #315e6b;
  --indigo-light: #527987;
  --gold: #c99a45;
  --moss: #71836b;
  --vermilion: #c6533c;
  --shadow: rgba(0, 0, 0, 0.5);
  --ease-material: cubic-bezier(0.37, 0, 0.23, 1);
}

* { box-sizing: border-box; }

html, body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
  background: var(--sumi);
}

body {
  color: var(--washi);
  font-family: "Manrope Variable", "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; }

.study {
  width: min(1680px, 100%);
  margin-inline: auto;
  padding: clamp(20px, 2.4vw, 38px);
}

.study-head {
  display: flex;
  align-items: center;
  min-height: 72px;
  margin-block-end: 22px;
}

.study-brand {
  width: 34px;
  height: 60px;
  margin-inline-end: 22px;
  filter: drop-shadow(0 5px 8px var(--shadow));
}

.study-brand svg { display: block; width: 100%; height: 100%; }
.brand-ink { fill: var(--washi); }
.brand-gold { fill: var(--gold); }

.study-title {
  margin: 0;
  font-size: clamp(20px, 1.6vw, 27px);
  font-weight: 610;
  letter-spacing: -0.025em;
}

.study-note {
  margin: 4px 0 0;
  color: var(--stone);
  font-size: 12px;
  font-weight: 520;
}

.motion-toggle {
  appearance: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-inline-start: auto;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--edge) 82%, transparent);
  border-radius: 50%;
  color: var(--washi-soft);
  background: var(--field-raised);
  box-shadow: 0 7px 16px var(--shadow), inset 0 1px 0 color-mix(in srgb, var(--washi) 6%, transparent);
  cursor: pointer;
  transition: color 140ms ease-out, border-color 140ms ease-out, transform 120ms ease-out;
}

.motion-toggle:hover { color: var(--washi); border-color: var(--gold); }
.motion-toggle:active { transform: scale(0.97); }
.motion-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.motion-toggle svg { width: 18px; height: 18px; }
.motion-toggle .play-mark { display: none; }
.paused .motion-toggle .pause-mark { display: none; }
.paused .motion-toggle .play-mark { display: block; }

.scene + .scene { margin-block-start: clamp(24px, 3vw, 42px); }

.scene-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin: 0 0 11px 2px;
}

.scene-title {
  margin: 0;
  font-size: 15px;
  font-weight: 630;
}

.scene-meta {
  color: var(--stone);
  font-size: 10px;
  font-weight: 560;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.variants {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(10px, 1.2vw, 18px);
}

.variant {
  position: relative;
  min-width: 0;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--edge) 76%, transparent);
  border-radius: 15px;
  background: var(--field);
  box-shadow: 0 13px 28px color-mix(in srgb, var(--shadow) 72%, transparent), inset 0 1px 0 color-mix(in srgb, var(--washi) 4%, transparent);
}

.variant::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--washi) 2.5%, transparent);
}

.variant-label {
  position: absolute;
  z-index: 4;
  top: 15px;
  left: 17px;
  color: var(--washi-soft);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.variant-label::before {
  content: "";
  display: inline-block;
  width: 12px;
  height: 1px;
  margin-inline-end: 8px;
  vertical-align: 0.3em;
  background: var(--gold);
}

.variant svg {
  display: block;
  width: 100%;
  aspect-ratio: 520 / 300;
}

.grid-major { stroke: var(--grid); stroke-width: 1; }
.grid-minor { stroke: var(--grid-soft); stroke-width: 1; }
.axis-label {
  fill: var(--stone);
  font: 520 8px "Manrope Variable", sans-serif;
}
.surface-fill { fill: url(#surface-fill); }
.surface-fiber { fill: url(#washi-fiber); opacity: 0.55; }
.surface-edge-under { fill: none; stroke: var(--sumi); stroke-width: 5; opacity: 0.66; }
.surface-edge { fill: none; stroke: var(--washi); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.live-thread { fill: none; stroke: var(--washi-soft); stroke-width: 0.8; opacity: 0.35; }
.gold-line { fill: none; stroke: var(--gold); stroke-linecap: round; stroke-linejoin: round; }
.red-line { fill: none; stroke: var(--vermilion); stroke-linecap: round; stroke-linejoin: round; }
.indigo-line { fill: none; stroke: var(--indigo-light); stroke-linecap: round; stroke-linejoin: round; }
.brush-ink { fill: var(--washi); }
.brush-gold { fill: var(--gold); }
.brush-red { fill: var(--vermilion); }
.brush-indigo { fill: var(--indigo); }

.enso-breathe {
  transform-box: fill-box;
  transform-origin: center;
  animation: enso-breathe 3.6s var(--ease-material) infinite;
}

.enso-flow {
  stroke-dasharray: 10 7;
  animation: line-flow 4.8s linear infinite;
}

.stamp {
  transform-box: fill-box;
  transform-origin: center;
  animation: stamp-pressure 4.2s var(--ease-material) infinite;
}

.material-tension {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: material-tension 3.2s var(--ease-material) infinite;
}

.seam-live {
  stroke-dasharray: 9 6;
  animation: seam-live 2.7s linear infinite;
}

.flow-a,
.flow-b {
  transform-box: fill-box;
  transform-origin: center;
}

.flow-a { animation: weave-a 5.4s var(--ease-material) infinite; }
.flow-b { animation: weave-b 5.4s var(--ease-material) infinite; }

.knot-breathe {
  transform-box: fill-box;
  transform-origin: center;
  animation: knot-breathe 3.8s var(--ease-material) infinite;
}

.paused * { animation-play-state: paused !important; }

@keyframes enso-breathe {
  0%, 100% { transform: scale(0.985) rotate(-0.4deg); opacity: 0.82; }
  50% { transform: scale(1.025) rotate(0.5deg); opacity: 1; }
}

@keyframes line-flow { to { stroke-dashoffset: -34; } }

@keyframes stamp-pressure {
  0%, 100% { transform: translateY(1px) rotate(-1deg) scale(0.985); opacity: 0.82; }
  38%, 68% { transform: translateY(0) rotate(0.35deg) scale(1.015); opacity: 1; }
}

@keyframes material-tension {
  0%, 100% { transform: scaleY(0.965) translateY(2px); opacity: 0.82; }
  48% { transform: scaleY(1.045) translateY(-2px); opacity: 1; }
}

@keyframes seam-live { to { stroke-dashoffset: -30; } }

@keyframes weave-a {
  0%, 100% { transform: translate(-4px, 1px); opacity: 0.42; }
  50% { transform: translate(5px, -1px); opacity: 0.68; }
}

@keyframes weave-b {
  0%, 100% { transform: translate(5px, -1px); opacity: 0.46; }
  50% { transform: translate(-5px, 1px); opacity: 0.7; }
}

@keyframes knot-breathe {
  0%, 100% { transform: scaleX(0.98) scaleY(1.015); opacity: 0.72; }
  50% { transform: scaleX(1.025) scaleY(0.985); opacity: 1; }
}

@media (max-width: 980px) {
  .variants { grid-template-columns: 1fr; }
  .variant svg { aspect-ratio: 520 / 260; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>

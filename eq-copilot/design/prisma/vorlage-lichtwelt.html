<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NAKAMA · Vorlage Lichtwelt</title>
<!--
  VORLAGE fuer die Lichtwelt-Gestaltung in Unicorn (NAK-16-Folge):
  die echte Prisma-Silhouette (Glanz-Pass der Rastpose, pixelgenau an
  ihrer Blatt-Position) mit Mass-Guides — Glasfenster, Zentrum,
  Greifzone des Glases. Screenshot dieses Blatts = Referenzbild fuers
  Unicorn-Artboard (1920x1280).
  Zahlen: renders/stmap/probe-stmap-meta.json + messung.json.
-->
<style>
  * { margin: 0; padding: 0; }
  body { background: #05070b; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="blatt" width="1920" height="1280"></canvas>
<script src="renders/stmap/stmap-daten.js"></script>
<script>
"use strict";
const c = document.getElementById("blatt").getContext("2d");
const BW = 1920, BH = 1280;
const GX = 576, GY = 128, GW = 768, GH = 1024;      // Glasfenster zentriert
// Prisma-Silhouette in Glas-Koordinaten (gemessen am Glanz-Pass):
const PX0 = GX + 150, PX1 = GX + 586;               // 726 .. 1162
const PY0 = GY + 100, PY1 = GY + 920;               // 228 .. 1048
const PCX = (PX0 + PX1) / 2, PCY = (PY0 + PY1) / 2; // ~944, ~638

c.fillStyle = "#05070b";
c.fillRect(0, 0, BW, BH);

const glanz = new Image();
glanz.onload = () => {
  // Geisterkoerper: Silhouette als zarte Flaeche sichtbar machen
  const tmp = document.createElement("canvas");
  tmp.width = GW; tmp.height = GH;
  const t = tmp.getContext("2d");
  t.drawImage(glanz, 0, 0);
  t.globalCompositeOperation = "source-in";
  t.fillStyle = "rgba(150, 180, 220, 0.10)";
  t.fillRect(0, 0, GW, GH);
  c.drawImage(tmp, GX, GY);
  // echter Glanz-Pass obendrauf (Kanten, Front-Streifen)
  c.drawImage(glanz, GX, GY);
  zeichneGuides();
};
glanz.src = STMAP_DATEN.glanzDataUrl;

function beschrifte(text, x, y, farbe = "#8a95a8", groesse = 15, fett = false) {
  c.fillStyle = farbe;
  c.font = (fett ? "600 " : "") + groesse + 'px "Segoe UI", system-ui, sans-serif';
  c.fillText(text, x, y);
}

function zeichneGuides() {
  // Pixel-Lineal am Rand (alle 128 px)
  c.strokeStyle = "#2a3448";
  c.fillStyle = "#4a5468";
  c.font = '11px Consolas, monospace';
  c.beginPath();
  for (let x = 128; x < BW; x += 128) {
    c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, 10);
    c.moveTo(x + 0.5, BH); c.lineTo(x + 0.5, BH - 10);
    c.fillText(String(x), x - 14, 24);
  }
  for (let y = 128; y < BH; y += 128) {
    c.moveTo(0, y + 0.5); c.lineTo(10, y + 0.5);
    c.moveTo(BW, y + 0.5); c.lineTo(BW - 10, y + 0.5);
    c.fillText(String(y), 14, y + 4);
  }
  c.stroke();

  // Glasfenster
  c.strokeStyle = "#4a5468";
  c.setLineDash([8, 6]);
  c.strokeRect(GX + 0.5, GY + 0.5, GW, GH);
  c.setLineDash([]);
  beschrifte("GLASFENSTER 768×1024 @ (576, 128)", GX + 6, GY - 10, "#6d7789", 14);

  // Prisma-Kasten + Zentrum
  c.strokeStyle = "rgba(232, 163, 76, 0.85)";
  c.setLineDash([3, 5]);
  c.strokeRect(PX0 + 0.5, PY0 + 0.5, PX1 - PX0, PY1 - PY0);
  c.setLineDash([]);
  c.beginPath();
  c.moveTo(PCX - 26, PCY + 0.5); c.lineTo(PCX + 26, PCY + 0.5);
  c.moveTo(PCX + 0.5, PCY - 26); c.lineTo(PCX + 0.5, PCY + 26);
  c.strokeStyle = "#e8a34c";
  c.stroke();
  beschrifte("PRISMA x 726–1162 · y 228–1048 · Zentrum (944, 638) — Kanten fast vertikal", PX0, PY1 + 30, "#e8a34c", 14, true);
  beschrifte("Silhouette = echter Glanz-Pass der Rastpose (pixelgenau)", PX0, PY1 + 52, "#6d7789", 13);

  // Greifzone: von dort holt das Glas seinen Inhalt
  const zonen = [
    [PX0 - 327, PX0, "Median-Griff 327 px"],
    [PX1, PX1 + 327, "Median-Griff 327 px"],
  ];
  c.fillStyle = "rgba(232, 163, 76, 0.06)";
  for (const [a, b] of zonen) c.fillRect(a, PY0, b - a, PY1 - PY0);
  c.strokeStyle = "rgba(232, 163, 76, 0.4)";
  c.setLineDash([2, 6]);
  for (const [a, b] of zonen) { c.strokeRect(a + 0.5, PY0 + 0.5, b - a, PY1 - PY0); }
  c.setLineDash([]);
  beschrifte("← das Glas holt Inhalt bis von HIER (Median 327 px, max ~1,5 Fensterbreiten)", 60, PCY - 470, "#e8a34c", 15, true);
  beschrifte("Welt muss auch an den Raendern und NEBEN dem Fenster leben — kein toter Rand", 60, PCY - 446, "#8a95a8", 13);

  // Kopfzeile
  beschrifte("VORLAGE LICHTWELT · Unicorn-Artboard 1920×1280 · dunkle Grundstimmung · feine scharfe Strukturen · ruhige Bewegung", 60, BH - 36, "#8a95a8", 14);
  beschrifte("NAKAMA · NAK-16", 60, 60, "#6d7789", 13);
}
</script>
</body>
</html>

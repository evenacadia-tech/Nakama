[package]
name = "eqcop-broker"
version = "0.1.0"
edition = "2021"
description = "EQ-Copilot-Broker (Nakama) — eigenständiger Named-Pipe-Server, aus der Plugin-Hub-App herausgelöst (18.08.2026)"

[lib]
name = "eqcop_broker"
path = "src/lib.rs"

[dependencies]
# SONDE-005b: MUSS die Version aus eq-copilot/schemas/v3/flatbuffers/WERKZEUG.json
# tragen. Der von flatc erzeugte Rust-Code ruft in diese Laufzeit; eine andere
# Version ist entweder ein Uebersetzungsfehler oder - schlimmer - eine stille
# Inkompatibilitaet. pruefe_flatc_drift.py haelt beide gegeneinander.
flatbuffers = "25.12.19"
serde = { version = "1", features = ["derive"] }
# SONDE-010: SHA-256 fuer den v3-Pipetoken (Entwurf §48.3). Er ist ab hier
# PRODUKTIONSCODE (transport::pipetoken) und keine Testbeigabe mehr - deshalb
# wandert die Crate aus [dev-dependencies] hierher. Der RFC-8785-state_hash
# nutzt dieselbe Crate weiter, jetzt ohne zweiten Eintrag.
sha2 = "0.10"
serde_json = "1"
# SONDE-011 Phase B: produktive persistente P0-Events speichern ihre interne
# Befehlswirkung als RFC-8785-kanonische Bytes fuer exakte Retry-Gleichheit.
serde_json_canonicalizer = "0.3"
uuid = { version = "1", features = ["v4"] }
# SONDE-011 Phase B / V-01: SQLite ist Teil des Broker-Binaries. Die exakte
# Version und `bundled` sind eine geprüfte Reproduzierbarkeitsgrenze der Matrix.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

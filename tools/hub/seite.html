<title>Nakama Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style id="hub-style">
:root{
  --grund:#F2F3F4;--flaeche:#FFFFFF;--flaeche2:#E9EBED;--linie:#D5D9DD;--linie2:#C3C8CD;
  --text:#1B1D1F;--text2:#4B5158;--text3:#7A8188;
  --akzent:#7E3D3E;--akzent-hell:#F1E4E4;
  --gut:#2F6B4F;--gut-hell:#E1EEE7;--warte:#9A6315;--warte-hell:#F6EBD6;--offen:#8A9098;
  --schatten:0 1px 2px rgba(27,29,31,.06),0 4px 14px rgba(27,29,31,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grund:#131416;--flaeche:#1B1D1F;--flaeche2:#222528;--linie:#2C3034;--linie2:#3A3F45;
    --text:#E7E9EA;--text2:#B8BDC2;--text3:#858B90;
    --akzent:#C9797B;--akzent-hell:#2C1F20;
    --gut:#6FB08E;--gut-hell:#1C2A23;--warte:#D9A05B;--warte-hell:#2C2419;--offen:#6B7177;
    --schatten:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --grund:#131416;--flaeche:#1B1D1F;--flaeche2:#222528;--linie:#2C3034;--linie2:#3A3F45;
  --text:#E7E9EA;--text2:#B8BDC2;--text3:#858B90;
  --akzent:#C9797B;--akzent-hell:#2C1F20;
  --gut:#6FB08E;--gut-hell:#1C2A23;--warte:#D9A05B;--warte-hell:#2C2419;--offen:#6B7177;
  --schatten:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--text);font-family:"Geist",system-ui,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}
a{color:var(--akzent)}
a:focus-visible,button:focus-visible,label:focus-within,input:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.seite{max-width:920px;margin:0 auto;padding:40px 24px 72px}
@media (max-width:600px){.seite{padding:24px 14px 56px}}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:15.5px;line-height:1.3}
p{margin:0}
.eyebrow{font-family:"Geist Mono",ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.kopf{display:grid;gap:14px;padding-bottom:28px;border-bottom:1px solid var(--linie)}
.kopf .lede{color:var(--text2);max-width:64ch;font-size:16px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.kachel{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;padding:14px 16px;display:grid;gap:4px;box-shadow:var(--schatten)}
.kachel .wert{font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kachel .wert small{font-size:13px;font-weight:500;color:var(--text3);margin-left:4px}
.kachel .sub{font-size:13px;color:var(--text2)}
section{padding-top:40px}
.abschnitt-kopf{display:grid;gap:6px;margin-bottom:18px}
.abschnitt-kopf p{color:var(--text2);max-width:68ch}
.abschnitt-kopf p.quelle{color:var(--text);background:var(--akzent-hell);border-radius:8px;padding:8px 12px;max-width:none}
.abschnitt-kopf p.quelle b{font-weight:500;color:var(--akzent)}
.gruppe{margin-top:22px}
.gruppe-titel{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.gruppe-titel .zahl{color:var(--text3);font-size:13px}
.karten{display:grid;gap:10px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-left:4px solid var(--offen);border-radius:10px;padding:14px 18px 14px 16px;display:grid;gap:8px;box-shadow:var(--schatten)}
.karte.jetzt{border-left-color:var(--warte)}
.karte.wissen{border-left-color:var(--akzent)}
.karte-kopf{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.chip{display:inline-block;font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--linie2);color:var(--text2);background:var(--flaeche2);white-space:nowrap}
.chip.warte{color:var(--warte);background:var(--warte-hell);border-color:transparent}
.chip.gut{color:var(--gut);background:var(--gut-hell);border-color:transparent}
.chip.akzent{color:var(--akzent);background:var(--akzent-hell);border-color:transparent}
.karte .was{color:var(--text)}
.karte .warum{color:var(--text2)}
.karte .warum b{color:var(--text);font-weight:500}
.karte .wo{font-size:12.5px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px 14px}
.figuren{display:grid;gap:10px;margin-top:4px}
.figuren figure{margin:0;background:#121315;border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.figuren figure img{display:block;width:auto;max-width:100%;height:auto;margin:0 auto}
.figuren details{background:#121315;border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.figuren details summary{cursor:pointer;padding:10px 12px;font-size:13.5px;color:var(--text2);background:var(--flaeche2);list-style:none;display:flex;gap:8px;align-items:center}
.figuren details summary::before{content:'▸';color:var(--text3)}
.figuren details[open] summary::before{content:'▾'}
.figuren details summary:focus-visible{outline:2px solid var(--akzent);outline-offset:-2px}
.figuren details img{display:block;width:100%;height:auto}
.figuren figure.klein img{padding:16px;min-height:80px}
.figuren figcaption{padding:8px 12px;font-size:13px;color:var(--text2);background:var(--flaeche2);border-top:1px solid var(--linie)}
.antwort{margin-top:4px;border-top:1px dashed var(--linie);padding-top:10px;display:grid;gap:8px}
.antwort .lbl{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.antwort .lbl .stand{text-transform:none;letter-spacing:0;font-size:12px}
.antwort .lbl .stand.neu{color:var(--warte)}
.antwort .lbl .stand.offen{color:var(--akzent)}
.wahlen{display:flex;flex-wrap:wrap;gap:6px}
.wahl{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--linie2);border-radius:999px;cursor:pointer;font-size:13px;color:var(--text2);background:var(--flaeche);user-select:none}
.wahl:has(input:checked){color:var(--text);border-color:var(--akzent);background:var(--akzent-hell)}
.wahl:has(input:focus-visible){outline:2px solid var(--akzent);outline-offset:2px}
.wahl input{appearance:none;width:9px;height:9px;border-radius:50%;border:1px solid var(--text3);margin:0}
.wahl input:checked{background:var(--akzent);border-color:var(--akzent)}
.antwort textarea{width:100%;min-height:54px;font:inherit;font-size:14px;line-height:1.45;padding:8px 10px;border:1px solid var(--linie2);border-radius:8px;background:var(--flaeche);color:var(--text);resize:vertical}
.antwort .ergebnis{font-size:13.5px;color:var(--text);background:var(--gut-hell);border-radius:6px;padding:6px 10px}
.antwort .ergebnis b{font-weight:500;color:var(--gut)}
.punkte{display:grid;gap:8px;margin-top:4px}
.punkt{border:1px solid var(--linie);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--flaeche2)}
.punkt .pk{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.punkt .pnum{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--akzent)}
.punkt .pk h4{margin:0;font-size:14.5px;font-weight:600}
.punkt .pgew{margin-left:auto;font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;color:var(--text3)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px;color:var(--text2)}
.ab b{display:block;font-family:"Geist Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;font-weight:500}
@media (max-width:600px){.ab{grid-template-columns:1fr}}
.punkt .antwort{border-top:1px dashed var(--linie2)}
.leiste{position:sticky;bottom:0;z-index:5;margin-top:24px;background:var(--flaeche);border:1px solid var(--linie2);border-radius:10px;padding:10px 14px;display:none;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
.leiste.da{display:flex}
.leiste .zaehl{font-size:14px;color:var(--text)}
.leiste .meld{font-size:13px;color:var(--text2);flex:1 1 auto}
.leiste .meld.fehler{color:var(--akzent)}
.leiste button{font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:8px;border:1px solid var(--akzent);background:var(--akzent);color:#fff;cursor:pointer}
.leiste button[disabled]{opacity:.6;cursor:default}
.leiste button.leer{background:transparent;color:var(--text2);border-color:var(--linie2)}
.notiz{margin-top:10px;display:grid;gap:4px}
.notiz label{font-size:12.5px;color:var(--text3)}
.notiz input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--linie2);border-radius:8px;background:var(--flaeche);color:var(--text)}
.eintrag .vorschau{margin-top:6px;background:#121315;border:1px solid var(--linie);border-radius:6px;overflow:hidden}
.eintrag .vorschau img{display:block;max-width:100%;max-height:360px;height:auto;margin:0 auto}
.eintrag .notizt{color:var(--text);font-size:14px}
.schritte{display:grid;gap:8px;background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;padding:14px 18px;box-shadow:var(--schatten)}
.schritt{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:baseline}
.schritt .rolle{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
@media (max-width:520px){.schritt{grid-template-columns:1fr;gap:2px}}
.phase{margin-top:26px;background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;overflow:hidden;box-shadow:var(--schatten)}
.phase-kopf{padding:14px 18px;display:grid;gap:4px;border-bottom:1px solid var(--linie);background:var(--flaeche2)}
.phase-kopf .code{color:var(--text3);font-size:12px}
.phase-kopf .ziel{color:var(--text2);font-size:14px;max-width:72ch}
.zeile{display:grid;grid-template-columns:26px 82px 1fr auto;gap:12px;align-items:start;padding:11px 18px;border-top:1px solid var(--linie)}
.zeile:first-of-type{border-top:0}
@media (max-width:600px){.zeile{grid-template-columns:26px 1fr;gap:6px 10px}.zeile .id{grid-column:2}.zeile .text{grid-column:2}.zeile .meta{grid-column:2}}
.zeile .mark{font-size:15px;line-height:1.5;text-align:center}
.zeile .id{font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px;color:var(--text2);padding-top:2px}
.zeile .text{color:var(--text);font-size:14.5px}
.zeile .text .ticket{color:var(--text3);font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;margin-left:6px}
.zeile .meta{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;color:var(--text3);text-align:right;white-space:nowrap;padding-top:3px;display:grid;gap:2px}
.zeile.erledigt .mark{color:var(--gut)}
.zeile.gebaut .mark{color:var(--gut)}
.zeile.naechster .mark{color:var(--akzent)}
.zeile.naechster .text{font-weight:500}
.zeile.beidir .mark{color:var(--warte)}
.zeile.beidir .text{font-weight:500}
.zeile.offen .mark,.zeile.wartet .mark{color:var(--offen)}
.zeile.offen .text,.zeile.wartet .text{color:var(--text2)}
.legende{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--text2)}
.legende span b{font-weight:500;margin-right:4px}
.app{margin-top:20px;background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;overflow:hidden;box-shadow:var(--schatten)}
.app .bild{background:#121315;display:flex;justify-content:center;line-height:0;border-bottom:1px solid var(--linie)}
.app .bild img{width:auto;max-width:100%;height:auto;display:block}
.app .bild .leer{color:#858B90;padding:40px 18px;line-height:1.5;font-size:14px;text-align:center}
.app .body{padding:14px 18px;display:grid;gap:8px}
.app .titel{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.app .titel .mass{color:var(--text3);font-size:12.5px}
.app .rolle{color:var(--text2);font-size:14px}
.app .stand{color:var(--text)}
.app .wo{font-size:12.5px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px 14px}
.hinweis{background:var(--flaeche2);border:1px solid var(--linie);border-radius:10px;padding:12px 16px;color:var(--text2);font-size:14px}
.drop{margin-top:6px;border:1.5px dashed var(--linie2);border-radius:10px;padding:22px 18px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer;background:var(--flaeche);transition:border-color .15s,background .15s}
.drop:hover,.drop.aktiv{border-color:var(--akzent);background:var(--akzent-hell)}
.drop.aus{cursor:default;opacity:.7}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop .gross{font-weight:500}
.drop .klein{font-size:13px;color:var(--text3)}
.status{margin-top:8px;font-size:13.5px;color:var(--text2);min-height:1.4em}
.status.fehler{color:var(--akzent)}
.liste{display:grid;gap:8px;margin-top:14px}
.eintrag{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;padding:12px 16px;display:grid;gap:4px;box-shadow:var(--schatten)}
.eintrag .kopfz{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.eintrag .kopfz .datum{color:var(--text3);font-size:12.5px}
.eintrag .kurz{color:var(--text2);font-size:14px}
.eintrag .wo{font-size:12.5px;color:var(--text3)}
.eintrag pre{margin:6px 0 0;max-height:160px;overflow:auto;background:var(--flaeche2);border:1px solid var(--linie);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--text2)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--linie);display:grid;gap:10px;color:var(--text2);font-size:13.5px}
footer ol{margin:0;padding-left:20px;display:grid;gap:4px}
footer .pfade{color:var(--text3);font-size:12.5px;display:grid;gap:2px}
@media (prefers-reduced-motion:reduce){.drop{transition:none}}
</style>
<div id="app"></div>
<script type="application/json" id="hub-state">{{STATE_JSON}}</script>
<script type="application/json" id="hub-bilder">{{BILDER_JSON}}</script>
<script id="hub-app">
(function(){
'use strict';
var STATE = JSON.parse(document.getElementById('hub-state').textContent);
var BILDER = JSON.parse(document.getElementById('hub-bilder').textContent);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsonInScript(o){return JSON.stringify(o).replace(/<\//g,'<\\/');}

var STATUS = {
  erledigt:  {mark:'✓', wort:'erledigt'},
  gebaut:    {mark:'◐', wort:'gebaut, Prüfurteil offen'},
  naechster: {mark:'▶', wort:'nächster Schritt'},
  'bei dir': {mark:'●', wort:'wartet auf dich', cls:'beidir'},
  wartet:    {mark:'◌', wort:'wartet auf etwas anderes'},
  offen:     {mark:'○', wort:'offen'}
};
function st(s){return STATUS[s]||STATUS.offen;}
function stCls(s){return (STATUS[s]&&STATUS[s].cls)||s.replace(/\s/g,'');}

function zaehle(plan){
  var z={gesamt:0,erledigt:0,gebaut:0,beidir:0};
  plan.forEach(function(p){p.zeilen.forEach(function(r){
    z.gesamt++; if(r.status==='erledigt')z.erledigt++; if(r.status==='gebaut')z.gebaut++; if(r.status==='bei dir')z.beidir++;
  });});
  return z;
}
function datumDe(iso){ if(!iso) return ''; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m? m[3]+'.'+m[2]+'.'+m[1] : iso; }

function rKopf(s){
  var z=zaehle(s.plan);
  var bd=s.bei_dir||[], jetzt=bd.filter(function(b){return b.dringlichkeit==='jetzt';}).length,
      bald=bd.filter(function(b){return b.dringlichkeit==='wenn du dazu kommst';}).length,
      spaeter=bd.length-jetzt-bald;
  var meta=[ 'Stand '+datumDe(s.stand) ];
  if(s.commit) meta.push('Commit '+s.commit);
  if(s.gebaut_am) meta.push('Seite gebaut '+s.gebaut_am);
  return '<header class="kopf">'+
    '<div class="eyebrow">Nakama · Briefing · '+esc(meta.join(' · '))+'</div>'+
    '<h1>Wo Nakama steht</h1>'+
    '<p class="lede">'+esc(s.stand_notiz)+'</p>'+
    '<div class="kacheln">'+
      '<div class="kachel"><div class="eyebrow">Plan</div><div class="wert">'+z.erledigt+'<small>von '+z.gesamt+' Zeilen erledigt</small></div><div class="sub">'+(z.gebaut?z.gebaut+' gebaut, Prüfurteil offen · ':'')+(z.gesamt-z.erledigt-z.gebaut)+' offen</div></div>'+
      '<div class="kachel"><div class="eyebrow">Bei dir</div><div class="wert">'+jetzt+'<small>jetzt</small></div><div class="sub">'+bald+' wenn du dazu kommst · '+spaeter+' später oder nur wissen</div></div>'+
      '<div class="kachel"><div class="eyebrow">Von dir</div><div class="wert">'+neueAntworten(s)+'<small>Antworten neu</small></div><div class="sub">'+(s.eingang||[]).length+' im Upload-Eingang · '+(s.reviews||[]).length+' Reviews eingearbeitet</div></div>'+
    '</div>'+
  '</header>';
}

var GRUPPEN=[
  {k:'jetzt', t:'Jetzt', sub:'hält etwas auf oder ist der nächste Schritt'},
  {k:'wenn du dazu kommst', t:'Wenn du dazu kommst', sub:'blockiert heute nichts, wird aber gebraucht'},
  {k:'wissen', t:'Nur wissen', sub:'kein Handgriff nötig — aber vor dem nächsten Klick im Kopf haben'},
  {k:'später', t:'Später, wenn das Ticket dran ist', sub:'steht hier, damit es nicht überrascht'}
];
function rBeiDir(s){
  var bd=s.bei_dir||[];
  var html='<section id="bei-dir"><div class="abschnitt-kopf"><div class="eyebrow">Bei dir</div><h2>Entscheide und Handgriffe, die nur du machen kannst</h2><p>Jede Karte sagt, was zu tun ist, warum es zählt und wo die Belegstelle liegt. Dein Wort im Chat genügt — Claude trägt es mit Datum und Wortlaut ein.</p></div>';
  GRUPPEN.forEach(function(g){
    var rows=bd.filter(function(b){return b.dringlichkeit===g.k;});
    if(!rows.length) return;
    html+='<div class="gruppe"><div class="gruppe-titel"><h3>'+esc(g.t)+'</h3><span class="zahl">'+rows.length+' · '+esc(g.sub)+'</span></div><div class="karten">';
    rows.forEach(function(b){
      html+='<article class="karte '+(g.k==='jetzt'?'jetzt':g.k==='wissen'?'wissen':'')+'">'+
        '<div class="karte-kopf"><span class="chip '+(g.k==='jetzt'?'warte':'')+'">'+esc(b.art)+'</span><h3>'+esc(b.titel)+'</h3></div>'+
        '<p class="was">'+esc(b.was)+'</p>'+
        rFiguren(b.bilder)+
        '<p class="warum"><b>Warum:</b> '+esc(b.warum)+'</p>'+
        '<div class="wo mono"><span>'+esc(b.wo)+'</span>'+(b.seit?'<span>seit '+esc(b.seit)+'</span>':'')+'</div>'+
        rPunkte(b)+
        rAntwort(b.id, b.wahlen||WAHLEN_KARTE, b.punkte&&b.punkte.length?'Deine Antwort zur ganzen Karte (die Punkte oben einzeln)':'Deine Antwort')+
      '</article>';
    });
    html+='</div></div>';
  });
  return html+'</section>';
}

function rFiguren(liste){
  if(!liste||!liste.length) return '';
  var h='<div class="figuren">';
  liste.forEach(function(bi){
    var b=BILDER['karte:'+bi.datei];
    if(!b||!b.src) return;
    if(b.h>2*b.w){ /* hohe Bilder (ganze Studie) zum Aufklappen, sonst wären sie winzig */
      h+='<details><summary>'+esc(bi.text)+' — aufklappen</summary><img src="'+b.src+'" width="'+b.w+'" height="'+b.h+'" alt="'+esc(bi.text)+'" loading="lazy"></details>';
    } else {
      h+='<figure class="'+(b.w<400?'klein':'')+'"><img src="'+b.src+'" width="'+b.w+'" height="'+b.h+'" alt="'+esc(bi.text)+'"><figcaption>'+esc(bi.text)+'</figcaption></figure>';
    }
  });
  return h+'</div>';
}

var WAHLEN_KARTE=['Ja','Nein','Anders (siehe Text)','Später'];
var WAHLEN_PUNKT=['Entwurf lassen','Alternative','Anders (siehe Text)','Später'];
var STATUS_ANTWORT={neu:'wartet auf Claude',gelesen:'gelesen',eingearbeitet:'eingearbeitet'};

var ENTWURF={};
try{ ENTWURF=JSON.parse(localStorage.getItem('hub-antwort-entwurf')||'{}')||{}; }catch(e){ ENTWURF={}; }
function neueAntworten(s){var a=s.antworten||{},n=0;Object.keys(a).forEach(function(k){if(a[k]&&a[k].status==='neu')n++;});return n;}
function entwurfAnders(id){
  var e=ENTWURF[id]; if(!e) return false;
  var g=ANTWORTEN[id]||{};
  return (e.wahl||'')!==(g.wahl||'') || (e.text||'')!==(g.text||'');
}
function rAntwort(id, wahlen, titel){
  var g=ANTWORTEN[id]||null, e=ENTWURF[id]||null;
  var wahl=(e&&e.wahl!==undefined)?e.wahl:(g?g.wahl:''), text=(e&&e.text!==undefined)?e.text:(g?g.text:'');
  var stand='';
  if(entwurfAnders(id)) stand='<span class="stand offen">ungespeichert — unten „Antworten speichern“</span>';
  else if(g) stand='<span class="stand '+(g.status==='neu'?'neu':'')+'">gespeichert '+esc(g.datum||'')+' · '+esc(STATUS_ANTWORT[g.status]||g.status||'')+'</span>';
  var h='<div class="antwort" data-id="'+esc(id)+'"><div class="lbl"><span>'+esc(titel||'Deine Antwort')+'</span>'+stand+'</div><div class="wahlen">';
  wahlen.forEach(function(w){ h+='<label class="wahl"><input type="radio" name="w-'+esc(id)+'" value="'+esc(w)+'"'+(wahl===w?' checked':'')+'>'+esc(w)+'</label>'; });
  h+='</div><textarea placeholder="In deinen Worten — das wird so zitiert.">'+esc(text)+'</textarea>';
  if(g&&g.ergebnis) h+='<div class="ergebnis"><b>Claude:</b> '+esc(g.ergebnis)+'</div>';
  return h+'</div>';
}
function rPunkte(b){

      '<div class="ab"><div><b>'+esc(p.links||'Entwurf (so gezeichnet)')+'</b>'+esc(p.entwurf)+'</div><div><b>'+esc(p.rechts||'Alternative')+'</b>'+esc(p.alternative)+'</div></div>'+

function rPlan(s){

function rReviews(s){
  var html='<section id="reviews"><div class="abschnitt-kopf"><div class="eyebrow">Codex-Reviews</div><h2>Hochladen: Reviews und Bilder</h2><p>Codex-Reviews als <span class="mono">.md</span>, Bilder als PNG/JPG/WebP — neue Figma-Exporte, Screenshots aus FL, Skizzen. Die Seite speichert alles in sich selbst; Claude liest es beim nächsten Sessionstart aus. Reviews werden Befund für Befund gegen die Quelldatei geprüft; Bilder landen unter „Von dir hochgeladen“, und Claude trägt ein, was damit passiert ist.</p></div>';
  html+='<div class="notiz"><label for="notiz">Wozu ist das? (kommt mit der Datei zu Claude)</label><input type="text" id="notiz" maxlength="400" placeholder="z. B. neuer Figma-Stand Gen, bitte in die Truhe — oder: so sieht der Fehler in FL aus"></div>';
  html+='<label class="drop" id="drop"><input type="file" id="datei" accept=".md,.markdown,.txt,image/png,image/jpeg,image/webp,image/gif" multiple><span class="gross">Datei hier ablegen oder klicken</span><span class="klein">.md / .txt oder Bild (PNG, JPG, WebP) · bis 8 MB je Datei · mehrere auf einmal möglich</span></label><div class="status" id="status" aria-live="polite"></div>';
  var e=s.eingang||[];
  if(e.length){
    html+='<div class="gruppe"><div class="gruppe-titel"><h3>Im Eingang</h3><span class="zahl">'+e.length+' · wartet auf Claude</span></div><div class="liste">';
    e.forEach(function(x){
      html+='<div class="eintrag"><div class="kopfz"><span class="chip warte">eingegangen</span><span class="mono">'+esc(x.name)+'</span><span class="datum mono">'+esc(x.datum)+' · '+(x.typ==='bild'?Math.round(x.groesse/1024)+' KB':esc(x.groesse)+' Zeichen')+'</span></div>'+
        (x.notiz?'<p class="notizt">'+esc(x.notiz)+'</p>':'')+
        (x.typ==='bild'?'<div class="vorschau"><img src="'+x.src+'" alt="'+esc(x.name)+'"></div>':'<pre>'+esc(x.text.slice(0,600))+(x.text.length>600?'\n…':'')+'</pre>')+
      '</div>';
    });
    html+='</div></div>';
  }
  var u=s.uploads||[];
  if(u.length){
    html+='<div class="gruppe"><div class="gruppe-titel"><h3>Von dir hochgeladen</h3><span class="zahl">'+u.length+'</span></div><div class="liste">';
    u.forEach(function(x){
      var b=BILDER['upload:'+x.datei];
      html+='<div class="eintrag"><div class="kopfz"><span class="chip '+(/eingegangen/.test(x.status)?'warte':'gut')+'">'+esc(x.status)+'</span><span class="mono">'+esc(x.name)+'</span><span class="datum mono">'+esc(datumDe(x.datum))+'</span></div>'+
        (x.notiz?'<p class="notizt">'+esc(x.notiz)+'</p>':'')+
        (x.ergebnis?'<p class="kurz">'+esc(x.ergebnis)+'</p>':'')+
        (b&&b.src?'<div class="vorschau"><img src="'+b.src+'" alt="'+esc(x.name)+'"></div>':'')+
        '<div class="wo mono">'+esc(x.datei)+'</div></div>';
    });
    html+='</div></div>';
  }
  var r=s.reviews||[];
  html+='<div class="gruppe"><div class="gruppe-titel"><h3>Reviews eingearbeitet</h3><span class="zahl">'+r.length+'</span></div><div class="liste">';
  if(!r.length) html+='<div class="hinweis">Noch keine Review eingearbeitet.</div>';
  r.forEach(function(x){
    html+='<div class="eintrag"><div class="kopfz"><span class="chip '+(/eingegangen|offen|in Arbeit/.test(x.status)?'warte':'gut')+'">'+esc(x.status)+'</span><span>'+esc(x.quelle)+' → '+esc(x.ziel)+'</span><span class="datum mono">'+esc(datumDe(x.datum))+'</span></div><p class="kurz">'+esc(x.kurz)+'</p><div class="wo mono">'+esc(x.datei)+'</div></div>';
  });
  return html+'</div></div></section>';
}

function rFuss(s){
  return '<footer><div class="eyebrow">So bleibt diese Seite wahr</div><ol>'+
    '<li>Jede Claude-Session liest diese Seite beim Start und prüft den Eingang.</li>'+
    '<li>Quelle ist <span class="mono">docs/hub/hub.json</span> im Nakama-Repo; die Seite wird daraus gebaut und neu veröffentlicht — nie von Hand editiert.</li>'+
    '<li>Ein Entscheid von dir steht erst hier, wenn er mit Datum und Wortlaut im Register (CLAUDE.md) ist.</li>'+
    '<li>Zahlen kommen aus Manifesten (<span class="mono">docs/beweise/</span>), nie aus dem Gedächtnis.</li>'+
  '</ol><div class="pfade mono"><span>Plan: docs/bauaufteilung-sonden.md · Offen-Set: docs/offene-punkte.md · Design: design/abnahmen/</span></div></footer>';
}

function render(){
  document.getElementById('app').innerHTML = '<div class="seite">'+rKopf(STATE)+rBeiDir(STATE)+rNaechster(STATE)+rPlan(STATE)+rDesign(STATE)+rReviews(STATE)+rFuss(STATE)+rLeiste()+'</div>';
  upload();
  antworten();
}

/* Vollständige Seitenquelle aus den autorisierten Bausteinen (nie aus dem Live-DOM). */
function quelle(state){
  var style=document.getElementById('hub-style').textContent;
  var app=document.getElementById('hub-app').textContent;
  var bilder=document.getElementById('hub-bilder').textContent;
  return '<!doctype html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Nakama Hub</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">\n'+
    '<style id="hub-style">'+style+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<script type="application/json" id="hub-state">'+jsonInScript(state)+'<\/script>\n'+
    '<script type="application/json" id="hub-bilder">'+bilder+'<\/script>\n'+
    '<script id="hub-app">'+app+'<\/script>\n</body>\n</html>\n';
}
window.__hubQuelle = quelle; /* für den Upload-Test */

function upload(){
  var drop=document.getElementById('drop'), input=document.getElementById('datei'), status=document.getElementById('status');
  function sag(t,fehler){status.textContent=t;status.className='status'+(fehler?' fehler':'');}
  var kann = !!(window.claude && typeof window.claude.use==='function');
  if(!kann){ drop.classList.add('aus'); input.disabled=true; sag('Upload nur in der claude.ai-Ansicht möglich (hier fehlt die Speicher-Funktion).'); return; }
  var artP = window.claude.use('artifact');
  var MAX=8*1024*1024;
  function istBild(f){return /^image\/(png|jpeg|webp|gif)$/.test(f.type)||/\.(png|jpe?g|webp|gif)$/i.test(f.name);}
  function liesAlle(files){
    return Promise.all(Array.prototype.map.call(files,function(f){
      if(f.size>MAX) return Promise.reject({code:'zu_gross',message:f.name});
      return new Promise(function(ok,nein){
        var r=new FileReader();
        r.onerror=function(){nein(new Error('Datei nicht lesbar: '+f.name));};
        if(istBild(f)){ r.onload=function(){ok({name:f.name,typ:'bild',src:String(r.result),groesse:f.size});}; r.readAsDataURL(f); }
        else { r.onload=function(){ok({name:f.name,typ:'text',text:String(r.result),groesse:String(r.result).length});}; r.readAsText(f); }
      });
    }));
  }
  function speichere(files){
    if(!files||!files.length) return;
    sag('Wird gespeichert …');
    var art;
    artP.then(function(a){
      art=a; if(!art) throw {code:'not_granted'};
      return liesAlle(files);
    }).then(function(list){
      var s=JSON.parse(JSON.stringify(STATE)); s.eingang=s.eingang||[];
      var j=new Date(),p2=function(n){return (n<10?'0':'')+n;}; var stamp=j.getFullYear()+'-'+p2(j.getMonth()+1)+'-'+p2(j.getDate())+' '+p2(j.getHours())+':'+p2(j.getMinutes());
      var notiz=(document.getElementById('notiz').value||'').trim();
      list.forEach(function(x){ x.datum=stamp; if(notiz) x.notiz=notiz; s.eingang.push(x); });
      return art.publish(quelle(s));
    }).then(function(){
      sag('Gespeichert — die Seite lädt neu. Claude liest den Eingang beim nächsten Sessionstart.');
    }).catch(function(e){
      var c=(e&&e.code)||'';
      if(c==='zu_gross') sag('„'+(e.message||'')+'“ ist größer als 8 MB — bitte verkleinern oder im Chat anhängen.',true);
      else if(c==='not_writer'||c==='not_granted') sag('Diese Ansicht ist schreibgeschützt — nur der Eigentümer kann hochladen.',true);
      else if(c==='conflict') sag('Eine neuere Version der Seite ist da; sie lädt neu. Danach bitte noch einmal ablegen.',true);
      else if(c==='too_large') sag('Zu groß — die Seite darf 16 MB nicht überschreiten. Datei kürzen.',true);
      else if(c==='rate_limited') sag('Zu schnell hintereinander — kurz warten, dann noch einmal.',true);
      else if(c==='not_declared'||c==='capability_disabled'||c==='capability_removed') sag('Die Speicher-Funktion ist für diese Seite nicht aktiv. Claude muss sie beim nächsten Veröffentlichen wieder einschalten.',true);
      else sag('Speichern fehlgeschlagen ('+(c||(e&&e.message)||'unbekannt')+'). Noch einmal versuchen; bleibt es, die Datei im Chat anhängen.',true);
      input.value='';
    });
  }
  input.addEventListener('change',function(){speichere(input.files);});
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('aktiv');});});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('aktiv');});});
  drop.addEventListener('drop',function(e){ if(e.dataTransfer&&e.dataTransfer.files) speichere(e.dataTransfer.files); });
}

function antworten(){
  var leiste=document.getElementById('leiste'), zaehl=document.getElementById('leiste-zaehl'), meld=document.getElementById('leiste-meld'),
      btn=document.getElementById('leiste-speichern'), verwerfen=document.getElementById('leiste-verwerfen');
  function offene(){ return Object.keys(ENTWURF).filter(entwurfAnders); }
  function merk(){ try{ localStorage.setItem('hub-antwort-entwurf', JSON.stringify(ENTWURF)); }catch(e){} }
  function zeige(){ /* Elemente frisch holen — nach einem Re-Render (Verwerfen) wären die alten losgelöst */
    var leiste=document.getElementById('leiste'), zaehl=document.getElementById('leiste-zaehl');
    var n=offene().length;
    leiste.classList.toggle('da', n>0);
    zaehl.textContent = n+' '+(n===1?'Antwort':'Antworten')+' ungespeichert';
    document.querySelectorAll('.antwort').forEach(function(el){
      var id=el.getAttribute('data-id'), lbl=el.querySelector('.lbl'), alt=lbl.querySelector('.stand');
      var g=ANTWORTEN[id], s;
      if(entwurfAnders(id)) s='<span class="stand offen">ungespeichert — unten „Antworten speichern“</span>';
      else if(g) s='<span class="stand '+(g.status==='neu'?'neu':'')+'">gespeichert '+esc(g.datum||'')+' · '+esc(STATUS_ANTWORT[g.status]||g.status||'')+'</span>';
      else s='';
      if(alt) alt.remove();
      if(s) lbl.insertAdjacentHTML('beforeend', s);
    });
  }
  if(!antworten.gebunden){ antworten.gebunden=true;
  document.addEventListener('change', function(ev){
    var a=ev.target.closest&&ev.target.closest('.antwort'); if(!a) return;
    var id=a.getAttribute('data-id'); ENTWURF[id]=ENTWURF[id]||{};
    if(ev.target.type==='radio') ENTWURF[id].wahl=ev.target.value;
    if(ev.target.tagName==='TEXTAREA') ENTWURF[id].text=ev.target.value;
    if(ENTWURF[id].wahl===undefined) ENTWURF[id].wahl=(ANTWORTEN[id]||{}).wahl||'';
    if(ENTWURF[id].text===undefined) ENTWURF[id].text=(ANTWORTEN[id]||{}).text||'';
    merk(); zeige();
  });
  document.addEventListener('input', function(ev){
    if(!(ev.target.tagName==='TEXTAREA')) return;
    var a=ev.target.closest('.antwort'); if(!a) return;
    var id=a.getAttribute('data-id'); ENTWURF[id]=ENTWURF[id]||{};
    ENTWURF[id].text=ev.target.value;
    if(ENTWURF[id].wahl===undefined) ENTWURF[id].wahl=(ANTWORTEN[id]||{}).wahl||'';
    merk(); zeige();
  });
  }
  verwerfen.addEventListener('click', function(){ ENTWURF={}; merk(); render(); });
  var kann = !!(window.claude && typeof window.claude.use==='function');
  btn.addEventListener('click', function(){
    var ids=offene(); if(!ids.length) return;
    if(!kann){ meld.textContent='Speichern geht nur in der claude.ai-Ansicht.'; meld.className='meld fehler'; return; }
    btn.disabled=true; meld.textContent='Wird gespeichert …'; meld.className='meld';
    window.claude.use('artifact').then(function(art){
      if(!art) throw {code:'not_granted'};
      var s=JSON.parse(JSON.stringify(STATE)); s.antworten=s.antworten||{};
      var j=new Date(),p2=function(n){return (n<10?'0':'')+n;}; var stamp=j.getFullYear()+'-'+p2(j.getMonth()+1)+'-'+p2(j.getDate())+' '+p2(j.getHours())+':'+p2(j.getMinutes());
      ids.forEach(function(id){ var e=ENTWURF[id]; s.antworten[id]={wahl:e.wahl||'',text:e.text||'',datum:stamp,status:'neu'}; });
      return art.publish(quelle(s));
    }).then(function(){
      ENTWURF={}; merk();
      meld.textContent='Gespeichert — die Seite lädt neu. Claude liest deine Antworten beim nächsten Sessionstart.';
    }).catch(function(e){
      btn.disabled=false; var c=(e&&e.code)||''; meld.className='meld fehler';
      if(c==='not_writer'||c==='not_granted') meld.textContent='Diese Ansicht ist schreibgeschützt — nur der Eigentümer kann speichern.';
      else if(c==='conflict') meld.textContent='Eine neuere Version der Seite ist da; sie lädt neu. Deine Eingaben bleiben im Browser — danach noch einmal speichern.';
      else if(c==='rate_limited') meld.textContent='Zu schnell hintereinander — kurz warten, dann noch einmal.';
      else meld.textContent='Speichern fehlgeschlagen ('+(c||(e&&e.message)||'unbekannt')+'). Deine Eingaben bleiben im Browser.';
    });
  });
  zeige();
}

render();
})();
</script>
